name: Build & Package CursorDemo Extension

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Verify & Build Extension Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read manifest version
        id: meta
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run syntax, locale & parity verification
        run: npm test

      - name: Build clean dist/ unpacked & Chrome Web Store .zip
        run: npm run build

      - name: Upload downloadable Extension .zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursordemo-v${{ steps.meta.outputs.version }}-extension-zip
          path: |
            dist/cursordemo.zip
            dist/cursordemo-v${{ steps.meta.outputs.version }}.zip
          retention-days: 90

      - name: Publish GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/cursordemo.zip
            dist/cursordemo-v${{ steps.meta.outputs.version }}.zip
